[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compboost"
version = "1.0.0"
authors = [
  { name="André Kafanke", email="andre.kafanke@outlook.com" },
]
description = "A high-performance, tensor-vectorized Component-wise Gradient Boosting library in PyTorch."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Intel macOS: no torch release newer than 2.2, which requires numpy<2.
    "torch>=2.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.21.0,<2.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # All other platforms: torch>=2.3 supports numpy 2.
    "torch>=2.3.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.21.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "scikit-learn>=1.6.0",
    "scipy>=1.8.0"
]

[project.optional-dependencies]
test = ["pytest", "pandas"]

[project.urls]
"Homepage" = "https://github.com/kafandre/CompBoost"
"Bug Tracker" = "https://github.com/kafandre/CompBoost/issues"

[tool.setuptools.packages.find]
where = ["src"]